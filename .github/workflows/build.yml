name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiRastreador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiRastreador-apk
          path: MiRastreador.apk

      - name: Publicar APK (Release y rama apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MiRastreador.apk --title "Mi Rastreador $TAG" --notes "APK listo para instalar en Android." --latest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rq --cached .
          git add -f MiRastreador.apk
          git commit -qm "APK $TAG"
          git push -f origin apk
